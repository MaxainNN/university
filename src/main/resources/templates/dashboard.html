<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - Electronic Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body class="dashboard-page">

<div class="nav">
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/dashboard/calendar}">Calendar</a>
    <a th:href="@{/logout}">Logout</a>
</div>

<div class="container">
    <h1>Welcome, <span th:text="${user.username}">User</span>!</h1>

    <div class="section">
        <h3>Quick Stats</h3>
        <p>Total Tasks: <span th:text="${tasks.size()}">0</span></p>
        <p>Overdue Tasks: <span th:text="${overdueTasks.size()}">0</span></p>
    </div>

    <div class="section">
        <h3>Add New Task</h3>
        <form th:action="@{/dashboard/tasks}" method="post">
            <input type="text" name="title" placeholder="Task Title" required>
            <textarea name="description" placeholder="Description"></textarea>
            <select name="priority">
                <option value="LOW">Low</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="HIGH">High</option>
                <option value="URGENT">Urgent</option>
            </select>
            <input type="datetime-local" name="dueDate">
            <button type="submit">Add Task</button>
        </form>
    </div>

    <div class="section">
        <h3>Tasks</h3>
        <div th:each="task : ${tasks}">
            <div th:classappend="${task.status == 'COMPLETED'} ? 'task-completed' : ''">
                <h4 th:text="${task.title}">Task Title</h4>
                <p th:text="${task.description}">Description</p>

                <span th:if="${task.priority == 'LOW'}" class="priority-low" th:text="${task.priority}"></span>
                <span th:if="${task.priority == 'MEDIUM'}" class="priority-medium" th:text="${task.priority}"></span>
                <span th:if="${task.priority == 'HIGH'}" class="priority-high" th:text="${task.priority}"></span>
                <span th:if="${task.priority == 'URGENT'}" class="priority-urgent" th:text="${task.priority}"></span>
                <span th:if="${task.priority == null}" class="priority-default">MEDIUM</span>

                <span th:text="${task.dueDate != null} ? ${#temporals.format(task.dueDate, 'yyyy-MM-dd HH:mm')} : 'No due date'">Due Date</span>

                <form th:action="@{/dashboard/tasks/{id}/complete(id=${task.id})}"
                      method="post" th:if="${task.status != 'COMPLETED'}">
                    <button type="submit">Complete</button>
                </form>
            </div>
        </div>

        <div class="pagination">
            <a th:if="${currentPage > 0}"
               th:href="@{/dashboard/tasks(page=${currentPage - 1})}">&laquo; Previous</a>

            <span th:text="'Page ' + (${currentPage + 1}) + ' of ' + ${totalPages}"></span>

            <a th:if="${currentPage + 1 < totalPages}"
               th:href="@{/dashboard/tasks(page=${currentPage + 1})}">Next &raquo;</a>
        </div>
    </div>
</div>
</body>
</html>
