<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Calendar Search event result</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
<div class="search-results">
    <form th:action="@{/calendar/search}" method="get" class="search-form">
        <input type="text" name="query" th:value="${query}" placeholder="Search events..." required>
        <button type="submit">Search</button>
    </form>

    <h3 th:text="'Search results for: ' + ${query}"></h3>

    <ul>
        <li th:each="event : ${results}">
            <strong th:text="${event.title}"></strong>
            <span th:text="${#temporals.format(event.startTime, 'yyyy-MM-dd HH:mm')}"></span>
        </li>
    </ul>

    <a th:href="@{/calendar}">← Back to calendar</a>
</div>
</body>
</html>
