<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Calendar - Electronic Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body class="calendar-page">
<div class="nav">
    <a href="/dashboard">Dashboard</a> |
    <a href="/calendar">Calendar</a> |
    <a th:href="@{/dashboard/profile}">Profile</a> |
    <a href="/logout">Logout</a>
</div>

<form th:action="@{/calendar/search}" method="get" class="search-form">
    <input type="text" name="query" th:value="${query}" placeholder="Search events..." required>
    <button type="submit">Search</button>
</form>

<div class="calendar-header">
    <a th:href="@{/calendar(date=${previousMonth})}" class="btn">&lt; Prev</a>
    <h2 th:text="${#temporals.format(selectedDate, 'MMMM yyyy')}">November 2025</h2>
    <a th:href="@{/calendar(date=${nextMonth})}" class="btn">Next &gt;</a>
</div>

<div id="month-view" class="calendar-grid"
     th:with="days=${#numbers.sequence(1, selectedDate.lengthOfMonth())}">
    <div class="day-cell"
         th:each="day : ${days}"
         th:classappend="${eventsByDay[day]} != null ? 'has-event' : ''">
        <div class="date-number" th:text="${day}">1</div>

        <div class="event-list" th:if="${eventsByDay[day]} != null">
            <div th:each="ev : ${eventsByDay[day]}">
                <p th:text="${ev.title}"></p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
