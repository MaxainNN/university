<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Calendar - Electronic Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body class="calendar-page">
<div class="nav">
    <a href="/dashboard">Dashboard</a> |
    <a href="/calendar">Calendar</a> |
    <a th:href="@{/dashboard/profile}">Profile</a> |
    <a href="/logout">Logout</a>
</div>

<div class="calendar-actions">
    <a th:href="@{/dashboard/calendar/create}" class="btn btn-primary">+ Add Event</a>

    <form th:action="@{/dashboard/calendar/search}" method="get" class="search-form">
        <input type="text" name="query" th:value="${query}" placeholder="Search events..." required>
        <button type="submit">Search</button>
    </form>
</div>

<div class="calendar-header">
    <a th:href="@{/dashboard/calendar(date=${previousMonth})}" class="btn">&lt; Prev</a>
    <h2 th:text="${#temporals.format(selectedDate, 'MMMM yyyy')}">November 2025</h2>
    <a th:href="@{/dashboard/calendar(date=${nextMonth})}" class="btn">Next &gt;</a>
</div>

<div class="month-selector">
    <form th:action="@{/dashboard/calendar}" method="get" class="month-form">
        <select name="date" onchange="this.form.submit()">
            <option th:each="month : ${availableMonths}"
                    th:value="${month}"
                    th:text="${#temporals.format(month, 'MMMM yyyy')}"
                    th:selected="${month == selectedDate}">
            </option>
        </select>
    </form>
</div>

<div id="month-view" class="calendar-grid">
    <div class="day-header">Mon</div>
    <div class="day-header">Tue</div>
    <div class="day-header">Wed</div>
    <div class="day-header">Thu</div>
    <div class="day-header">Fri</div>
    <div class="day-header">Sat</div>
    <div class="day-header">Sun</div>

    <div th:each="i : ${#numbers.sequence(1, firstDayOfWeek - 1)}"
         class="day-cell empty"></div>

    <div th:each="day : ${#numbers.sequence(1, daysInMonth)}"
         class="day-cell"
         th:classappend="${eventsByDay[day] != null ? 'has-event' : ''}">

        <div class="date-number" th:text="${day}">1</div>

        <div class="event-indicator" th:if="${eventsByDay[day] != null}">
            <div class="event-count-badge" th:text="${eventsByDay[day].size()}">1</div>
        </div>

        <div class="event-data" style="display: none;"
             th:attr="data-day=${day}">
        </div>
    </div>
</div>

<div id="dayModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h3 id="modalDate"></h3>
        <div id="modalEvents"></div>
        <div class="modal-actions">
            <button id="addEventToDay" class="btn btn-primary">Add Event to This Day</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function() {
        const dayCells = document.querySelectorAll('.day-cell:not(.empty)');

        const selectedDateStr = /*[[${selectedDateJs}]]*/ '2025-11-01';
        const eventsData = /*[[${eventsJson}]]*/ {};

        console.log('Selected date string:', selectedDateStr);
        console.log('Events data:', eventsData);

        dayCells.forEach(cell => {
            const day = cell.querySelector('.date-number').textContent;

            cell.style.cursor = 'pointer';
            cell.addEventListener('click', function() {
                const dayEvents = eventsData[day] || [];
                console.log('Events for day', day, ':', dayEvents);

                const selectedDate = new Date(selectedDateStr);
                const currentYear = selectedDate.getFullYear();
                const currentMonth = selectedDate.getMonth();

                showDayEvents(parseInt(day), currentMonth, currentYear, dayEvents);
            });
        });

        const addEventBtn = document.getElementById('addEventToDay');
        if (addEventBtn) {
            addEventBtn.addEventListener('click', function() {
                const modalDate = document.getElementById('modalDate').textContent;
                const dateMatch = modalDate.match(/Events for (\d+) (\w+) (\d+)/);
                if (dateMatch) {
                    const day = dateMatch[1];
                    const month = dateMatch[2];
                    const year = dateMatch[3];

                    const eventDate = year + '-' + getMonthNumber(month) + '-' + day.padStart(2, '0');
                    window.location.href = '/dashboard/calendar/create?date=' + eventDate;
                }
            });
        }

        function showDayEvents(day, month, year, events) {
            const monthNames = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];

            document.getElementById('modalDate').textContent =
                'Events for ' + day + ' ' + monthNames[month] + ' ' + year;

            const modalEvents = document.getElementById('modalEvents');
            let eventsHtml = '';

            if (events && events.length > 0) {
                events.forEach(event => {
                    const startTime = formatTime(event.startTime);
                    const endTime = formatTime(event.endTime);

                    eventsHtml += `
                        <div class="event-detail">
                            <h4>${event.title || 'No title'}</h4>
                            <p><strong>Time:</strong> ${startTime} - ${endTime}</p>
                            ${event.annotation ? `<p><strong>Annotation:</strong> ${event.annotation}</p>` : ''}
                            ${event.notes ? `<p><strong>Notes:</strong> ${event.notes}</p>` : ''}
                        </div>
                        <hr>
                    `;
                });
            } else {
                eventsHtml = '<p>No events for this day.</p>';
            }

            modalEvents.innerHTML = eventsHtml;
            document.getElementById('dayModal').style.display = 'block';
        }

        function formatTime(dateTimeString) {
            try {
                const date = new Date(dateTimeString);
                return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            } catch (e) {
                console.error('Error formatting time:', e);
                return dateTimeString;
            }
        }

        function getMonthNumber(monthName) {
            const months = {
                'January': '01', 'February': '02', 'March': '03', 'April': '04',
                'May': '05', 'June': '06', 'July': '07', 'August': '08',
                'September': '09', 'October': '10', 'November': '11', 'December': '12'
            };
            return months[monthName] || '01';
        }

        const closeBtn = document.querySelector('.close');
        if (closeBtn) {
            closeBtn.addEventListener('click', function() {
                document.getElementById('dayModal').style.display = 'none';
            });
        }

        window.addEventListener('click', function(event) {
            const modal = document.getElementById('dayModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    });
    /*]]>*/
</script>


</body>
</html>
